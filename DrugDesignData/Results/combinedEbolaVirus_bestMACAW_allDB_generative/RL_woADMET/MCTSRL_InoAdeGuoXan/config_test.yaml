# Run with: python runMCTSRL.py config_test.yaml
# Purpose: small smoke-test configuration for potency-only MCTS-RL.
# This config uses only a few seeds, shallow MCTS depth, and a small number of simulations.
# After this passes, use config_mctsrl_gen1.yaml or config_mctsrl_gen3.yaml for full runs.

runtime:
  force_thread_env: true
  omp_num_threads: 2
  mkl_num_threads: 1
  openblas_num_threads: 1
  numexpr_num_threads: 1
project_paths:
  doranet_path: /users/sghosh6/DTRA_project/MACAW/doranet
  art_path: /users/sghosh6/DTRA_project/MACAW/AutomatedRecommendationTool
  extra_python_paths:
  - .
  - ..
output:
  output_dir: ./MCTSRL_test
  exclude_seed_molecules_from_generated: true
mode:
  run_smoke_tests: true
  smoke_test_n: 2
  smoke_mcts_simulations: 4
seed:
  seed_csv: ../../combinedEbola_allDORAnetGenerated_Antivirals_ARTprediction.csv
  smiles_col: SMILES
  max_seeds: 5
  minimum_columns:
  - SMILES
  - pPotency_prediction
  required_columns:
  - SMILES
  - pPotency_prediction
  - pPotency_std
  - pPotency_lower_95CI
  - pPotency_upper_95CI
  selection:
    method: top_potency_diverse
    potency_col: pPotency_prediction
    uncertainty_col: null
    similarity_threshold: 0.85
    fingerprint_radius: 2
    fingerprint_bits: 2048
    prefilter_multiplier: 5
  sampling:
    method: potency_softmax
    potency_col: pPotency_prediction
    temperature: 0.2
    min_weight: 1.0e-06
macaw:
  transformer_path: ../../combinedEbolaVirusData_allDB_MACAW_transformer.joblib
art:
  model_path: ../../ART_MACAW/ART_results/art.cpkl
  output_dir: ./ART_results
  input_feature_prefix: MACAW_
doranet:
  ruleset: JN3604IMT
  gen: 1
  max_raw_products: 256
  max_actions: 16
  action_selection: art_ranked_diverse
  action_rank_score:
    potency: 0.45
    parent_delta: 0.25
    frontier_delta: 0.3
  diversity:
    fingerprint_radius: 2
    fingerprint_bits: 2048
    max_tanimoto_to_selected: 0.95
  candidate_filters:
    exclude_seed_molecules: true
    remove_dummy_atoms: true
    remove_multifragment: true
    require_carbon: true
    min_heavy_atoms: 12
    max_heavy_atoms: 120
    allowed_elements:
    - C
    - N
    - O
    - S
    - P
    - F
    - Cl
    - Br
    - I
  job_prefix: mctsrl_test_gen1
  max_atoms_mode: from_seed_pool
  max_atoms_multiplier: 1.5
  max_atoms_elements:
  - C
  - N
  - O
  - S
  network_subdir: doranet_networks
  action_cache_enabled: true
  action_cache_subdir: action_cache_test
  precompute_seed_actions: false
  precompute_parallel: false
  precompute_num_workers: 1
  precompute_worker_omp_threads: 1
  precompute_fail_fast: false
rl:
  max_steps: 2
  max_actions: 16
  fingerprint_bits: 2048
reward:
  potencyTargetMode: best_seed_percent_increase
  potencyTargetPercentIncrease: 0.1
  potencyScale: 0.35
  deltaPotencyTarget: 0.05
  deltaPotencyScale: 0.08
  frontierDeltaTarget: 0.0
  frontierDeltaScale: 0.08
  minRouteLength: 1
  earlyStopPenalty: -0.75
  invalidActionPenalty: -0.5
  invalidActionTerminates: true
  weights:
    potency: 0.25
    deltaPotency: 0.25
    frontierDelta: 0.5
multi_objective:
  enabled: true
  preference_sets:
    potency_frontier:
      potency: 0.25
      deltaPotency: 0.25
      frontierDelta: 0.5
mcts:
  enabled: true
  top_seed_count: 2
  num_simulations_per_seed: 8
  max_depth: 2
  exploration_constant: 1.5
  discount_factor: 1.0
  prior_temperature: 0.7
  expansion_strategy: prior_order
  expand_top_k: 8
  rollout_policy: rank_softmax
  rollout_temperature: 0.5
  rollout_top_k: 8
  add_intermediate_candidates: true
  progressive_widening:
    enabled: false
    k: 2.0
    alpha: 0.5
  random_seed: 42
  max_unique_candidates: 200
  output_csv: mctsrl_test_generated_candidates.csv
  evaluated_output_csv: mctsrl_test_all_evaluated_candidates.csv
  edge_output_csv: mctsrl_test_tree_edges.csv
  root_summary_csv: mctsrl_test_root_summary.csv
pareto:
  enabled: true
  use_during_training: false
  initialize_with_seeds: true
  non_dominated_bonus: 0.0
  dominated_penalty: 0.0
  annotated_output_csv: mctsrl_test_candidates_with_pareto.csv
  front_output_csv: mctsrl_test_pareto_front.csv
  ranked_front_output_csv: mctsrl_test_pareto_front_ranked.csv
  objectives:
    pPotency_prediction: maximize
    deltaPotency: maximize
    frontierDeltaPotency: maximize
  ranking:
    enabled: true
    method: percentile
    pPotency_prediction: 0.25
    deltaPotency: 0.25
    frontierDeltaPotency: 0.5
diagnostics:
  potency_beam_search:
    enabled: false
    top_seed_count: 2
    max_depth: 1
    beam_width: 8
    top_output_rows: 50
    output_csv: diagnostic_test_doranet_beam_frontier.csv
training:
  enabled: false
rollout:
  enabled: false
  output_csv: mctsrl_test_generated_candidates.csv
plotting:
  enabled: true
  output_png: mctsrl_test_generated_vs_seed_potency.png

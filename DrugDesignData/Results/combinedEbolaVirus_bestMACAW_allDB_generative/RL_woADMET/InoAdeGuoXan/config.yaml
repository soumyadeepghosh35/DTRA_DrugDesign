# Run with: python runRL.py config.yaml

project_paths:
  doranet_path: /users/sghosh6/DTRA_project/MACAW/doranet
  art_path: /users/sghosh6/DTRA_project/MACAW/AutomatedRecommendationTool
  extra_python_paths: [., ..]

# The script will create separate directories by appending _gen1, _gen2,
# and _gen3 to this base output directory.
# Example:
#   RL_outputs_potency_gen_sweep_gen1
#   RL_outputs_potency_gen_sweep_gen2
#   RL_outputs_potency_gen_sweep_gen3
output:
  output_dir: RL_outputs_potency_gen_sweep

mode:
  # Recommended first validation run:
  #   run_smoke_tests: true
  #   training.enabled: false
  #   rollout.enabled: false
  run_smoke_tests: false
  smoke_test_n: 2

seed:
  seed_csv: ../../combinedEbola_allDORAnetGenerated_Antivirals_ARTprediction.csv
  smiles_col: SMILES
  max_seeds: 150

  # Only SMILES and predicted potency are required for potency-only RL.
  # pPotency_std can remain in the CSV for reporting, but the reward does not
  # use uncertainty as a penalty.
  minimum_columns: [SMILES, pPotency_prediction]
  required_columns: [SMILES, pPotency_prediction, pPotency_std, pPotency_lower_95CI, pPotency_upper_95CI]

  selection:
    method: top_potency_diverse
    potency_col: pPotency_prediction
    uncertainty_col: null
    similarity_threshold: 0.75
    fingerprint_radius: 2
    fingerprint_bits: 2048
    prefilter_multiplier: 10

  sampling:
    method: potency_softmax
    potency_col: pPotency_prediction
    temperature: 0.15
    min_weight: 0.000001

macaw:
  transformer_path: ../../combinedEbolaVirusData_allDB_MACAW_transformer.joblib

art:
  model_path: ../../ART_MACAW/ART_results/art.cpkl
  output_dir: .
  input_feature_prefix: MACAW_

doranet:
  ruleset: JN3604IMT

  # The workflow will run these as separate full RL jobs.
  gen_list: [1, 2, 3]

  max_actions: 64
  job_prefix: rl_potency_only

  # Dynamic max_atoms rule:
  #   1. Count C/N/O/S atoms in every selected seed molecule.
  #   2. For each element, take the largest count found in any selected seed.
  #   3. Set max_atoms[element] = ceil(largest_seed_count[element] * 1.5).
  # Example: if max C count across selected seeds is 10, C becomes 15.
  max_atoms_mode: from_seed_pool
  max_atoms_multiplier: 1.5
  max_atoms_elements: [C, N, O, S]

  # DORAnet JSON files are written inside each per-generation directory under
  # this subfolder, e.g. RL_outputs_potency_gen_sweep_gen2/doranet_networks.
  network_subdir: doranet_networks

rl:
  max_steps: 4
  max_actions: 64
  fingerprint_bits: 2048

# Potency-only reward. No toxicity, QED, route-depth, uncertainty, or
# potency-loss penalty is used in the reward calculation.
reward:
  potencyTarget: 5.85
  potencyScale: 0.20

  deltaPotencyTarget: 0.10
  deltaPotencyScale: 0.10

  invalidActionPenalty: -0.50
  invalidActionTerminates: true

  weights:
    potency: 0.70
    deltaPotency: 0.30

multi_objective:
  enabled: true
  preference_sets:
    potency_only:
      potency: 0.70
      deltaPotency: 0.30

pareto:
  enabled: true
  initialize_with_seeds: true
  non_dominated_bonus: 0.00
  dominated_penalty: 0.00
  annotated_output_csv: rl_potency_only_candidates_with_pareto.csv
  front_output_csv: rl_potency_only_pareto_front.csv
  ranked_front_output_csv: rl_potency_only_pareto_front_ranked.csv
  objectives:
    pPotency_prediction: maximize
    deltaPotency: maximize
  ranking:
    enabled: true
    method: percentile
    pPotency_prediction: 0.70
    deltaPotency: 0.30

# This diagnostic will run separately for each DORAnet gen value.
diagnostics:
  potency_beam_search:
    enabled: true
    top_seed_count: 25
    max_depth: 2
    beam_width: 32
    top_output_rows: 500
    output_csv: diagnostic_doranet_beam_potency_only.csv

training:
  enabled: true
  total_timesteps: 100000
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 128
  gamma: 0.97
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.08
  verbose: 1

rollout:
  enabled: true
  num_episodes_per_policy: 5000
  deterministic: false
  output_csv: rl_potency_only_generated_candidates.csv

plotting:
  enabled: true
  output_png: rl_potency_only_generated_vs_seed_potency.png

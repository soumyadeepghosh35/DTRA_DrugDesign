# Run as:
#   python runMACAW_InvDsg.py config_macaw_invdsg.yaml

runtime:
  # Add paths if MACAW / ART custom modules are not installed in the environment.
  extra_python_paths:
    - /users/sghosh6/DTRA_project/MACAW
  rdkit_warnings: false

input:
  csv: ../../combinedEbola_allDORAnetGenerated_Antivirals_ARTprediction.csv
  read_all_columns: false
  max_input_rows: null

models:
  # Pretrained MACAW embedder and ART model used in your notebook.
  mcw_path: ../../combinedEbolaVirusData_allDB_MACAW_transformer.joblib
  art_model_path: ../../ART_MACAW/ART_results/art.cpkl

columns:
  smiles: Canonical_SMILES
  potency: pPotency_prediction
  std: pPotency_std
  source: source_DataBase
  additional_seed_columns: []

target_potency: 6.5
random_seeds: [42, 52, 62, 72, 82]

art:
  feature_prefix: MACAW_
  pass_dataframe: true
  prediction_keys: [pPotency_prediction, prediction, mean, y_mean]

seed_selection:
  # Options: target_closest, diverse_then_target_closest
  method: diverse_then_target_closest
  n_seeds: 300
  diversity:
    # Same spirit as your existing diversity filter.
    similarity_threshold: 0.75
    diversity_weight: 0.75
    # target_weight defaults to 1 - diversity_weight if omitted.
    # Keep explicit here for reproducibility.
    target_weight: 0.25
    morgan_radius: 2
    morgan_bits: 2048
    # n_seeds * candidate_pool_factor molecules are considered before diversity selection.
    candidate_pool_factor: 10
    # n_seeds * diverse_pool_factor chemically diverse molecules are selected,
    # then the final n_seeds closest to target potency are retained.
    diverse_pool_factor: 3

campaigns:
  - label: transition_empirical_refine
    algorithm: transition
    p: empirical
    k1: 8000
    k2: 200
    n_rounds: 5
    n_hits: 100
    noise_factor: [0.30, 0.22, 0.16, 0.10, 0.08]
    force_new: true

  - label: transition_cumsum_broad
    algorithm: transition
    p: cumsum
    k1: 15000
    k2: 400
    n_rounds: 6
    n_hits: 150
    noise_factor: [0.65, 0.50, 0.35, 0.25, 0.16, 0.10]
    force_new: true

  - label: position_exp_broad
    algorithm: position
    p: exp
    k1: 15000
    k2: 400
    n_rounds: 6
    n_hits: 150
    noise_factor: [0.70, 0.55, 0.40, 0.28, 0.18, 0.10]
    force_new: true

  - label: dual_cumsum_broad
    algorithm: dual
    p: cumsum
    k1: 12000
    k2: 300
    n_rounds: 6
    n_hits: 150
    noise_factor: [0.60, 0.45, 0.32, 0.22, 0.15, 0.10]
    force_new: true

output:
  output_dir: ./MACAW_inverseDesign_results
  prefix: MACAW_generatedCompound
  save_outputs: true
  save_each_campaign: true
  top_n: 500
  tolerances: [0.10, 0.25, 0.50]

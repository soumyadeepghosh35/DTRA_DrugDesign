# =============================================================================
# DORAnet Parallel Processing Configuration
# Run as:
#   python runDORAnet_autoGenMaxAtoms.py -c config_autoGenMaxAtoms.yaml
# =============================================================================

input:
  # Path to CSV file containing starter SMILES molecules
  SMILESfile: "../../combinedEbola_allDORAnetGenerated_Antivirals_wARTprediction_top20.csv"

  # Column name in CSV file that contains starter SMILES strings
  smiles_column: "Canonical_SMILES"

  # Row index to start processing from; 0 means first row
  start_index: 0

  # Number of SMILES to process; null means process all rows
  num_smiles: null

output:
  # Base output directory. The script will create generation-specific directories:
  #   doranet_output_gen1
  #   doranet_output_gen2
  #   doranet_output_gen3
  directory: "doranet_output"

  # Controls the suffix added to output.directory for each generation.
  generation_suffix_template: "_gen{gen}"

  # Also write doranet_output/processing_summary_all_generations.csv
  write_combined_summary: true

parallel:
  # Number of parallel workers. The script caps this at available CPU cores.
  num_workers: 10

  # Timeout while collecting each worker result.
  result_timeout_seconds: 600

  # Timeout while joining each worker process.
  join_timeout_seconds: 60

network:
  # Run DORAnet separately for gen 1, gen 2, and gen 3.
  generations: [1, 2, 3]

  # DORAnet ruleset to use for enzymatic reactions.
  ruleset: "JN3604IMT"

  # Direction of network expansion.
  direction: "forward"

max_atoms:
  # auto_from_starters means:
  #   1. Read all starter SMILES from input.SMILESfile.
  #   2. Count C/N/O/S atoms in each starter molecule.
  #   3. For each element, take the maximum count across all starters.
  #   4. Multiply that maximum by multiplier.
  #   5. Round according to rounding.
  # Example: max starter carbon count = 10 -> ceil(10 * 1.5) = 15.
  mode: "auto_from_starters"

  elements: ["C", "N", "O", "S"]
  multiplier: 1.5
  rounding: "ceil"

  # Optional lower bounds after scaling. This prevents zero caps for elements
  # that are absent from all starters. You can set all values to 0 if preferred.
  minimum:
    C: 1
    N: 0
    O: 0
    S: 0

  # Used only when mode: "static".
  static_values:
    C: 12
    N: 3
    O: 5
    S: 3

# DORAnet targeted multi-generation pathway generation config
# Usage: python doranet_pathways_multiGen.py config_doranet_multiGen.yaml

doranetPath: "/users/sghosh6/DTRA_project/MACAW/doranet"
outputDir: "."

baseJobPrefix: "high_pPotency_molecule_pathway"
generationSuffixTemplate: "_wGen{generation}"

# Generation depths to run separately. Each N produces exactly N-step pathways.
generationsToRun: [1, 2, 3]
searchDepthEqualsGeneration: true
maxNumRxnsEqualsGeneration: true
filterExactNumRxns: true
exactNumRxnsEqualsGeneration: true

# Parallel jobs. Total = number_of_pairs * number_of_generations.
numParallelJobs: 16
numProcess: 1

# CSV input — must contain startersColumn and targetsColumn.
# starters and maxAtoms are no longer hardcoded; both are derived from the CSV.
targetsCsvPath: "combinedEbola_allDORAnetGenerated_Antivirals_wARTprediction_top20.csv"
startersColumn: "starter_Canonical_SMILES"
targetsColumn: "Canonical_SMILES"

# Optional: restrict to specific 1-based row indices. null = run all rows.
targetsToTest: null

# maxAtoms is computed per starter as ceil(atomCount * atomMultiplier).
# Example: starter with 6 C atoms → maxAtoms C = ceil(6 * 1.5) = 9
#          starter with 5 C atoms → maxAtoms C = ceil(5 * 1.5) = 8
atomMultiplier: 1.5

helpers:
  - "C#N"
  - "N"
  - "S"
  - "[H][H]"
  - "O=S=O"
  - "N#CO"
  - "O=S(=O)(O)O"
  - "[Br][Br]"
  - "O=NO"
  - "O"
  - "C=O"
  - "NO"
  - "N#N"
  - "CO"
  - "O=[N+]([O-])O"
  - "O=S(O)O"
  - "Br"
  - "O=O"
  - "O=C=O"
  - "[C-]#[O+]"
  - "C=C"

direction: "forward"
ruleset: "JN3604IMT"

minRxnAtomEconomy: 0.0
sanitize: true
removePureHelpersRxns: false
transformEnolsFlag: false
considerNameDifference: true
runRanking: true
runVisualization: false

summaryCsv: "job_summary.csv"

weights: null
coolReactions: null
reaxysResultName: null
excludeSmiles: null
reaxysRxnColor: "blue"
normalRxnColor: "black"

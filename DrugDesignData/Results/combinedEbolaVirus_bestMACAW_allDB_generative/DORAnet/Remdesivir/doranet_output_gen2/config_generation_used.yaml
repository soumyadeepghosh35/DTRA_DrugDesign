input:
  SMILESfile: ../../RemdesivirOnly_DORAnetGenerated_wARTprediction_top20.csv
  smiles_column: Canonical_SMILES
  smiles_column_candidates:
  - Canonical_SMILES
  - canonical_smiles
  - SMILES
  - Smiles
  - smiles
  start_index: 0
  num_smiles: null
  deduplicate_smiles: false
  resolved_smiles_column: Canonical_SMILES
output:
  directory: doranet_output_gen2
  overwrite_existing_output_dir: true
  overwrite_existing_starter_dirs: true
  save_generation_config: true
  save_starter_config: true
parallel:
  num_workers: 10
network:
  generations: 2
  ruleset: JN3604IMT
  direction: forward
max_atoms:
  mode: per_starter
  elements:
  - C
  - N
  - O
  - S
  multiplier: 1.5
  rounding: ceil
  minimum:
    C: 0
    N: 0
    O: 0
    S: 0
validation:
  fail_on_invalid_smiles: true
  expected_num_starters: 20
post_processing:
  run_one_step: true
